<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b31">
<title>WordLab — тренування IT-слів</title>
<style>
:root{color-scheme:light;--ink:#14213a;--muted:#61718a;--line:#dbe4ee;--blue:#305eea;--blue2:#234aca;--pale:#ecf2ff;--bg:#f4f7fc;--white:#fff;--green:#147d67;--red:#c4404e;--shadow:0 18px 50px rgba(19,40,76,.1);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.52}button:focus-visible,input:focus-visible{outline:3px solid #78baff;outline-offset:3px}.shell{max-width:1100px;margin:auto;padding:24px 20px 72px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem;letter-spacing:-.035em}.logo{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:var(--ink);color:#fff;font-size:1rem;letter-spacing:0}.count{color:var(--muted);font-size:.9rem}.eyebrow{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--blue);margin:0 0 7px}.intro h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;letter-spacing:-.045em;margin:0 0 8px}.intro p:last-child{margin:0;color:var(--muted)}.intro{margin-bottom:20px}.panel{background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.deck-select{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0 23px}.deck-choice{background:#fff;text-align:left;border:2px solid var(--line);border-radius:17px;padding:17px 18px;min-height:112px;color:var(--ink);transition:.18s}.deck-choice:hover{border-color:#94aafa;transform:translateY(-2px)}.deck-choice.active{border-color:var(--blue);background:var(--pale);box-shadow:inset 0 0 0 1px var(--blue)}.deck-choice strong{display:block;font-size:1.06rem}.deck-choice span{display:block;color:var(--muted);font-size:.89rem;margin-top:4px}.section-title{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px}.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.mode{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:100px;padding:9px 15px;font-weight:700}.mode:hover{border-color:var(--blue)}.mode.active{background:var(--ink);color:#fff;border-color:var(--ink)}.workspace{padding:24px;min-height:390px}.work-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:18px}.work-head h2{font-size:1.32rem;letter-spacing:-.03em;margin:0 0 3px}.work-head p{color:var(--muted);margin:0;font-size:.92rem}.work-head .step{background:var(--bg);border-radius:100px;padding:5px 11px;color:var(--muted);font-size:.85rem;white-space:nowrap}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.seg{display:inline-flex;gap:4px;background:#edf2fa;border-radius:12px;padding:4px}.seg button{padding:7px 11px;border:0;background:transparent;border-radius:9px;color:var(--muted);font-size:.89rem;font-weight:700}.seg button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #1d375421}.ghost{border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);background:#fff;font-weight:700}.ghost:hover{background:var(--pale)}.primary{border:0;border-radius:11px;background:var(--blue);color:white;padding:11px 17px;font-weight:800}.primary:hover{background:var(--blue2)}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 17px;font-weight:700}.controls{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:17px}.flip-scene{perspective:1200px;max-width:620px;margin:auto}.flash{display:block;position:relative;width:100%;min-height:280px;appearance:none;border:0;background:transparent;color:var(--ink);padding:0;text-align:center;cursor:pointer}.flash-inner{display:block;position:relative;width:100%;height:280px;transform-style:preserve-3d;transition:transform .48s ease}.flash.flipped .flash-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px 34px;border:1px solid #cbd9ee;border-radius:20px;background:linear-gradient(150deg,#fff 42%,#e9f0ff);box-shadow:0 14px 34px #28457b20;overflow:auto}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#dfeaff,#f6f9ff)}.face small{font-size:.77rem;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--blue);margin-bottom:18px}.face strong{font-size:clamp(1.4rem,3.4vw,2.35rem);line-height:1.18;letter-spacing:-.035em;overflow-wrap:anywhere}.face .meaning{font-size:clamp(1.05rem,2.5vw,1.48rem);line-height:1.3;letter-spacing:0}.face em{font-style:normal;color:var(--muted);font-size:.87rem;margin-top:12px}.face .hint{margin-top:18px;color:var(--muted);font-size:.83rem}.progress{height:7px;background:#e8eef7;border-radius:100px;overflow:hidden;margin:0 0 20px}.progress span{display:block;height:100%;background:var(--blue);border-radius:inherit;transition:width .3s}.prompt{max-width:700px;margin:10px auto 22px;text-align:center}.prompt small{display:block;color:var(--muted);font-weight:800;font-size:.79rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}.prompt strong{display:block;font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.3;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:700px;margin:auto}.answer,.match-item{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:14px;text-align:left;font-weight:650;line-height:1.35;overflow-wrap:anywhere}.answer:hover:not(:disabled),.match-item:hover:not(:disabled){border-color:#8da7ff;background:#f5f8ff}.answer.correct,.match-item.matched{border-color:#52b49d;background:#e8f9f3;color:#126750}.answer.wrong,.match-item.wrong{border-color:#ef9ca3;background:#fff0f1;color:#a43140}.match-item.selected{border-color:var(--blue);background:var(--pale);box-shadow:inset 0 0 0 1px var(--blue)}.matches{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:810px;margin:0 auto}.match-col{display:grid;gap:8px;align-content:start}.match-item{min-height:57px}.status{text-align:center;min-height:28px;color:var(--muted);margin:17px auto 0;font-weight:700}.status.ok{color:var(--green)}.status.bad{color:var(--red)}.input-row{display:flex;gap:9px;max-width:600px;margin:auto}.input-row input{min-width:0;flex:1;border:1.5px solid #cbd8e8;border-radius:11px;padding:10px 13px;color:var(--ink);background:#fff}.reveal{text-align:center;color:var(--muted);margin:12px 0 0}.letters{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;max-width:670px;margin:14px auto}.letter{min-width:40px;min-height:42px;border:1px solid #b9caed;border-radius:10px;background:#eff4ff;color:var(--ink);font-size:1.1rem;font-weight:800}.slots{min-height:52px;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;max-width:650px;margin:auto}.slot{min-width:25px;min-height:36px;border-bottom:2px solid #9fb4df;text-align:center;font-size:1.25rem;font-weight:800}.slot.space{border:0;min-width:12px}.review-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.review-actions button{min-width:135px}.summary{max-width:550px;margin:36px auto;text-align:center}.summary .badge{display:inline-grid;place-items:center;border-radius:18px;background:var(--pale);color:var(--blue);font-size:2rem;width:65px;height:65px;margin-bottom:10px}.summary h3{font-size:1.7rem;margin:0 0 8px}.summary p{color:var(--muted);margin:0 0 20px}.foot{color:#748198;font-size:.81rem;text-align:center;margin-top:18px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){.shell{padding:17px 12px 40px}.top{margin-bottom:18px}.count{display:none}.deck-select{grid-template-columns:1fr;margin-top:15px}.deck-choice{min-height:0;padding:13px 15px}.workspace{padding:17px 12px;min-height:400px}.work-head{flex-wrap:wrap}.answers{grid-template-columns:1fr}.matches{gap:6px}.match-item{padding:10px;font-size:.88rem;min-height:66px}.flash,.flash-inner{min-height:300px;height:300px}.face{padding:21px}.input-row{flex-direction:column}.input-row .primary{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
/* Фізична картка: глибина, тонкий торець, відблиск і тінь на поверхні. */
.flip-scene{perspective:950px;perspective-origin:50% 45%;padding:7px 3px 19px}
.flash{isolation:isolate;-webkit-tap-highlight-color:transparent}
.flash::after{content:"";position:absolute;z-index:-1;left:9%;right:9%;bottom:-12px;height:24px;border-radius:50%;background:#213a68;filter:blur(14px);opacity:.19;transform:scaleX(1);transition:transform .72s cubic-bezier(.2,.7,.2,1),opacity .72s}
.flash.flipped::after{transform:scaleX(.84);opacity:.27}
.flash-inner{height:280px;transform:rotateY(0deg);transform-style:preserve-3d;transition:transform .76s cubic-bezier(.18,.76,.18,1);will-change:transform}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-inner::before{content:"";position:absolute;inset:3px;border-radius:19px;background:#b9c8df;box-shadow:0 10px 22px #1a355632;transform:translateZ(-4px);backface-visibility:hidden}
.face{transform:translateZ(3px);overflow:hidden;border:1px solid #c7d4e6;background:linear-gradient(145deg,#fff 6%,#f8fbff 68%,#e8effb);box-shadow:inset 0 1px 0 #fff, inset 0 -3px 8px #5b76a514,0 12px 25px #1b35602a}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(116deg,transparent 19%,#ffffffaa 36%,#ffffff0a 50%,transparent 67%);opacity:.42}
.face>*{position:relative;z-index:1}
.back{transform:rotateY(180deg) translateZ(3px);background:linear-gradient(150deg,#edf3ff,#dfe9fc 80%,#d3e0f7)}
.back::after{background:linear-gradient(115deg,transparent 22%,#fff9 39%,transparent 62%)}
@media(hover:hover){.flash:not(.flipped):hover .flash-inner{transform:translateY(-3px) rotateX(-2deg) rotateY(4deg)}.flash.flipped:hover .flash-inner{transform:translateY(-3px) rotateX(-2deg) rotateY(176deg)}}
@media(max-width:650px){.flash-inner{height:300px}}
@media(prefers-reduced-motion:reduce){.flash-inner,.flash::after{transition-duration:.01ms!important}.flash:not(.flipped):hover .flash-inner{transform:none}.flash.flipped:hover .flash-inner{transform:rotateY(180deg)}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="logo">W<span aria-hidden="true">✦</span></span> WordLab</div><span class="count" id="total-label"></span></header>
<main>
<div class="intro"><p class="eyebrow">Англійська · Комп’ютерні терміни</p><h1>Вивчай слова у своєму темпі</h1><p>Спочатку обери набір, а потім спосіб тренування.</p></div>
<section aria-label="Набір карток"><h2 class="section-title">1 · Набір карток</h2><div class="deck-select" id="decks"></div></section>
<section aria-label="Режим навчання"><h2 class="section-title">2 · Режим навчання</h2><nav class="modes" id="modes" aria-label="Режими"></nav></section>
<section class="panel workspace" id="workspace" aria-live="polite"></section>
<p class="foot">Усе працює без інтернету. Відповіді не надсилаються на сервер.</p>
</main></div>
<script>
'use strict';
const WORDS=[
{en:'accept',ua:'приймати',def:'to agree to receive or take something',stress:'ac-CEPT'},
{en:'certain',ua:'певний, визначений, конкретний',def:'known or definite; specific',stress:'CER-tain'},
{en:'process',ua:'обробляти (інформацію)',def:'to handle data and produce a result',stress:'PRO-cess'},
{en:'define',ua:'визначати',def:'to explain exactly what something means',stress:'de-FINE'},
{en:'external',ua:'зовнішній',def:'located outside something',stress:'ex-TER-nal'},
{en:'internal',ua:'внутрішній',def:'located inside something',stress:'in-TER-nal'},
{en:'CPU (central processing unit)',ua:'центральний процесор',def:'the main processor that carries out computer instructions',stress:'C-P-U · CEN-tral PRO-cess-ing U-nit'},
{en:'Blu-ray',ua:'блюрей (оптичний диск для відео високої чіткості)',def:'an optical disc format for high-definition video and data',stress:'BLU-ray'},
{en:'fan (heat sink)',ua:'кулер, пристрій охолодження',def:'a fan or heat-dissipating part that cools computer components',stress:'fan · HEAT sink'},
{en:'order',ua:'наказувати',def:'to tell someone to do something',stress:'OR-der'},
{en:'operate',ua:'працювати, функціонувати',def:'to work or make a machine work',stress:'OP-er-ate'},
{en:'peripherals',ua:'периферійні пристрої, пристрої введення-виведення',def:'devices connected to a computer, such as a keyboard or printer',stress:'pe-RIPH-er-als'},
{en:'brain, “smarts”',ua:'мозок, розум',def:'the part responsible for thinking or intelligence',stress:'brain · smarts'},
{en:'silicon',ua:'кремній',def:'a chemical element used to make computer chips',stress:'SIL-i-con'},
{en:'interpret',ua:'тлумачити, інтерпретувати',def:'to understand and explain the meaning of information',stress:'in-TER-pret'},
{en:'execute',ua:'виконувати',def:'to carry out an instruction or program',stress:'EX-e-cute'},
{en:'keep track',ua:'відстежувати, контролювати',def:'to follow and record changes or progress',stress:'keep TRACK'},
{en:'performance',ua:'продуктивність, експлуатаційні якості',def:'how well a computer or system works',stress:'per-FORM-ance'},
{en:'clock speed',ua:'тактова частота',def:'the rate at which a processor completes clock cycles',stress:'CLOCK speed'},
{en:'hertz',ua:'герц',def:'a unit of frequency equal to one cycle per second',stress:'hertz'},
{en:'cycles per second',ua:'герци, періоди за секунду',def:'the number of repeated cycles in one second',stress:'CY-cles per SEC-ond'},
{en:'RAM (random access memory)',ua:'оперативна пам’ять, пам’ять з довільним доступом',def:'temporary memory used while a computer is running',stress:'RAM · RAN-dom AC-cess MEM-o-ry'},
{en:'ROM (read only memory)',ua:'постійна пам’ять, пам’ять тільки для читання',def:'memory that stores data usually kept when power is off',stress:'ROM · read ON-ly MEM-o-ry'},
{en:'DIMM (dual in-line memory module)',ua:'модуль оперативної пам’яті з двома рядами контактів',def:'a common type of removable computer memory module',stress:'DIMM · DU-al IN-line MEM-o-ry MOD-ule'},
{en:'volatile',ua:'енергозалежний (дані зникають після вимкнення живлення)',def:'losing stored data when power is turned off',stress:'VOL-a-tile'},
{en:'routine',ua:'підпрограма',def:'a sequence of instructions for a specific task',stress:'rou-TINE'},
{en:'capacity',ua:'ємність',def:'the amount something can hold or store',stress:'ca-PAC-i-ty'},
{en:'expand',ua:'розширювати',def:'to increase in size or capacity',stress:'ex-PAND'},
{en:'insert',ua:'вставляти',def:'to put something into something else',stress:'in-SERT'},
{en:'feed',ua:'подавати, постачати',def:'to supply material or information to a machine',stress:'feed'},
{en:'touch screen',ua:'сенсорний екран',def:'a display you control by touching it',stress:'TOUCH screen'},
{en:'drive',ua:'привід, накопичувач',def:'a device that reads or stores computer data',stress:'drive'},
{en:'light pen',ua:'світлове перо (пристрій введення для екрана)',def:'a pen-like input device used to select things on a screen',stress:'LIGHT pen'},
{en:'barcode reader',ua:'сканер штрихкоду',def:'a device that scans and reads printed barcodes',stress:'BAR-code READ-er'}
];
const deckInfo={uk:{name:'Англійська ↔ українська',sub:'Слово з одного боку, переклад з іншого'},en:{name:'Англійська ↔ пояснення',sub:'Слово з одного боку, визначення англійською'}};
const modeInfo={cards:['Картки','Перегортай і повторюй усі слова'],match:['Знайди пару','З’єднай 6 слів із їхніми значеннями'],quiz:['Обери відповідь','Один правильний варіант із чотирьох'],type:['Напиши відповідь','Пригадай слово або його значення самостійно'],build:['Склади слово','Віднови англійське слово з літер'],review:['Швидке повторення','Відкладай складні слова для ще одного кола']};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let state={deck:null,mode:'cards',dir:'forward',index:0,flipped:false,sequence:shuffle(WORDS.map((_,i)=>i)),score:0,answered:false,status:'',match:null,build:null,review:null};
const meaning=w=>state.deck==='uk'?w.ua:w.def;
const directionLabels=()=>state.deck==='uk'?['EN → UK','UK → EN']:['Слово → пояснення','Пояснення → слово'];
const source=w=>state.dir==='forward'?w.en:meaning(w);const target=w=>state.dir==='forward'?meaning(w):w.en;
const frontLabel=()=>state.dir==='forward'?'Англійське слово':state.deck==='uk'?'Український переклад':'Пояснення англійською';
function heading(title,sub,step=''){return `<div class="work-head"><div><h2>${title}</h2><p>${sub}</p></div>${step?`<span class="step">${step}</span>`:''}</div>`}
function prog(x,n){return `<div class="progress" role="progressbar" aria-label="Прогрес" aria-valuenow="${x}" aria-valuemin="0" aria-valuemax="${n}"><span style="width:${n?100*x/n:0}%"></span></div>`}
function direction(){let labels=directionLabels();return `<div class="seg" aria-label="Напрямок"><button data-action="direction" data-dir="forward" class="${state.dir==='forward'?'active':''}" aria-pressed="${state.dir==='forward'}">${labels[0]}</button><button data-action="direction" data-dir="reverse" class="${state.dir==='reverse'?'active':''}" aria-pressed="${state.dir==='reverse'}">${labels[1]}</button></div>`}
function renderShell(){ $('#total-label').textContent=`${WORDS.length} слова · 2 набори · 5 вправ`;
$('#decks').innerHTML=Object.entries(deckInfo).map(([id,d])=>`<button class="deck-choice ${state.deck===id?'active':''}" data-deck="${id}" aria-pressed="${state.deck===id}"><strong>${d.name}</strong><span>${d.sub}</span></button>`).join('');
$('#modes').innerHTML=Object.entries(modeInfo).map(([id,v])=>`<button class="mode ${state.deck&&state.mode===id?'active':''}" data-mode="${id}" aria-current="${state.deck&&state.mode===id?'page':'false'}" ${state.deck?'':'disabled'}>${v[0]}</button>`).join('');render()}
function reset(){state.index=0;state.flipped=false;state.sequence=shuffle(WORDS.map((_,i)=>i));state.score=0;state.answered=false;state.status='';state.match=null;state.build=null;state.review=null;renderShell()}
function completion(extra=''){return `<div class="summary"><div class="badge" aria-hidden="true">✓</div><h3>Готово!</h3><p>${extra}</p><button class="primary" data-action="restart">Почати ще раз</button></div>`}
function renderCards(){let n=state.sequence.length;if(state.index>=n){$('#workspace').innerHTML=heading('Картки','Усі слова переглянуто')+completion(`Ти переглянула ${n} карток.`);return}let w=WORDS[state.sequence[state.index]];$('#workspace').innerHTML=heading('Картки','Натисни на картку, щоб побачити інший бік',`${state.index+1} / ${n}`)+prog(state.index,n)+`<div class="flip-scene"><button class="flash ${state.flipped?'flipped':''}" data-action="flip" aria-label="Перегорнути картку" aria-pressed="${state.flipped}"><span class="flash-inner"><span class="face"><small>Англійське слово</small><strong>${esc(w.en)}</strong><em>Наголос: ${esc(w.stress)}</em><span class="hint">Натисни, щоб перегорнути ↻</span></span><span class="face back"><small>${state.deck==='uk'?'Український переклад':'Пояснення англійською'}</small><strong class="meaning">${esc(meaning(w))}</strong><span class="hint">Натисни, щоб перегорнути ↻</span></span></span></button></div><div class="controls"><button class="secondary" data-action="prev" ${state.index===0?'disabled':''}>← Назад</button><button class="primary" data-action="next">${state.index===n-1?'Завершити':'Наступна →'}</button><button class="ghost" data-action="shuffle">Перемішати</button></div>`}
function makeMatch(){let ids=shuffle(WORDS.map((_,i)=>i)).slice(0,6);state.match={ids,left:shuffle(ids),right:shuffle(ids),selected:null,done:[],mistakes:0,status:''}}
function renderMatch(){if(!state.match)makeMatch();let m=state.match;if(m.done.length===6){$('#workspace').innerHTML=heading('Знайди пару','Раунд завершено')+completion(`6 пар знайдено · помилок: ${m.mistakes}.`);return}
let left=m.left.map(i=>{let w=WORDS[i],v=state.dir==='forward'?w.en:meaning(w);return `<button class="match-item ${m.selected===i?'selected':''} ${m.done.includes(i)?'matched':''}" data-action="match-left" data-id="${i}" ${m.done.includes(i)?'disabled':''}>${esc(v)}</button>`}).join('');let right=m.right.map(i=>{let w=WORDS[i],v=state.dir==='forward'?meaning(w):w.en;return `<button class="match-item ${m.done.includes(i)?'matched':''}" data-action="match-right" data-id="${i}" ${m.done.includes(i)?'disabled':''}>${esc(v)}</button>`}).join('');$('#workspace').innerHTML=heading('Знайди пару','Натисни елемент ліворуч, потім його пару праворуч',`${m.done.length} / 6`)+prog(m.done.length,6)+`<div class="tools">${direction()}<button class="ghost" data-action="new-round">Інші 6 слів</button></div><div class="matches"><div class="match-col">${left}</div><div class="match-col">${right}</div></div><p class="status ${m.status==='Правильно!'?'ok':m.status?'bad':''}" role="status">${esc(m.status)}</p>`}
function choices(){let w=WORDS[state.sequence[state.index]],correct=target(w);let distractors=shuffle(WORDS.filter(x=>x!==w).map(target)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);return shuffle([correct,...distractors])}
function renderQuiz(){let n=state.sequence.length;if(state.index>=n){$('#workspace').innerHTML=heading('Обери відповідь','Результат')+completion(`${state.score} правильних із ${n}.`);return}let w=WORDS[state.sequence[state.index]];if(!state.options)state.options=choices();$('#workspace').innerHTML=heading('Обери відповідь','Вибери правильну відповідь',`${state.index+1} / ${n}`)+prog(state.index,n)+`<div class="tools">${direction()}</div><div class="prompt"><small>${frontLabel()}</small><strong>${esc(source(w))}</strong></div><div class="answers">${state.options.map((o,i)=>`<button class="answer ${state.answered?(o===target(w)?'correct':i===state.chosen?'wrong':''):''}" data-action="answer" data-choice="${i}" ${state.answered?'disabled':''}>${esc(o)}</button>`).join('')}</div><p class="status ${state.answered?(state.chosenCorrect?'ok':'bad'):''}" role="status">${state.answered?(state.chosenCorrect?'Правильно!':`Правильна відповідь: ${esc(target(w))}`):' '}</p><div class="controls">${state.answered?`<button class="primary" data-action="advance">${state.index===n-1?'Результат':'Далі →'}</button>`:''}</div>`}
const norm=x=>x.toLocaleLowerCase('uk').replace(/[’‘`´]/g,"'").replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ');
function variants(s){let arr=[s,...s.split(/[,;(]/).map(x=>x.replace(/[)]/g,'').trim())];let first=s.split(/[,;(]/)[0].trim();arr.push(first);return arr.filter(Boolean).map(norm)}
function renderType(){let n=state.sequence.length;if(state.index>=n){$('#workspace').innerHTML=heading('Напиши відповідь','Результат')+completion(`${state.score} правильних із ${n}.`);return}let w=WORDS[state.sequence[state.index]];$('#workspace').innerHTML=heading('Напиши відповідь','Пиши без підказок; регістр не має значення',`${state.index+1} / ${n}`)+prog(state.index,n)+`<div class="tools">${direction()}</div><div class="prompt"><small>${frontLabel()}</small><strong>${esc(source(w))}</strong></div><form class="input-row" id="type-form"><label class="sr-only" for="typed">Твоя відповідь</label><input id="typed" autocomplete="off" spellcheck="false" placeholder="Твоя відповідь" ${state.answered?'disabled':''} required><button class="primary" ${state.answered?'disabled':''}>Перевірити</button></form><p class="status ${state.answered?(state.chosenCorrect?'ok':'bad'):''}" role="status">${state.answered?(state.chosenCorrect?'Правильно!':`Правильна відповідь: ${esc(target(w))}`):' '}</p>${state.answered?`<div class="controls"><button class="primary" data-action="advance">${state.index===n-1?'Результат':'Далі →'}</button></div>`:''}`;if(!state.answered)$('#typed').focus()}
function buildPool(){return WORDS.map((w,i)=>i).filter(i=>/^[a-z]+$/i.test(WORDS[i].en))}
function makeBuild(){let w=WORDS[state.build.sequence[state.build.index]];state.build.letters=shuffle(w.en.toUpperCase().split('').map((ch,id)=>({ch,id})));state.build.picked=[];state.build.status=''}
function renderBuild(){let b=state.build;if(!b){state.build={sequence:shuffle(buildPool()),index:0,score:0,letters:[],picked:[],status:''};b=state.build;makeBuild()}let n=b.sequence.length;if(b.index>=n){$('#workspace').innerHTML=heading('Склади слово','Результат')+completion(`${b.score} слів складено без помилок із ${n}.`);return}let w=WORDS[b.sequence[b.index]],letters=b.letters;$('#workspace').innerHTML=heading('Склади слово','Натискай літери в потрібному порядку',`${b.index+1} / ${n}`)+prog(b.index,n)+`<div class="prompt"><small>${state.deck==='uk'?'Український переклад':'Пояснення англійською'}</small><strong>${esc(meaning(w))}</strong></div><div class="slots" aria-label="Складене слово">${w.en.split('').map((_,idx)=>`<span class="slot">${b.picked[idx]===undefined?'&nbsp;':esc(letters[b.picked[idx]].ch)}</span>`).join('')}</div><div class="letters">${letters.map((o,i)=>`<button class="letter" data-action="letter" data-id="${i}" aria-label="Літера ${o.ch}" ${b.picked.includes(i)||b.status?'disabled':''}>${o.ch}</button>`).join('')}</div><div class="controls"><button class="secondary" data-action="undo" ${!b.picked.length||!!b.status?'disabled':''}>Стерти літеру</button><button class="ghost" data-action="clear" ${!b.picked.length||!!b.status?'disabled':''}>Очистити</button></div><p class="status ${b.status==='Правильно!'?'ok':'bad'}" role="status">${esc(b.status||' ')}</p>${b.status?`<div class="controls"><button class="primary" data-action="build-next">${b.index===n-1?'Результат':'Далі →'}</button></div>`:''}`}
function makeReview(){state.review={queue:shuffle(WORDS.map((_,i)=>i)),later:[],done:0,total:WORDS.length,round:1,show:false}}
function renderReview(){if(!state.review)makeReview();let r=state.review;if(!r.queue.length){if(r.later.length){r.queue=shuffle(r.later);r.later=[];r.round++;r.show=false}else{$('#workspace').innerHTML=heading('Швидке повторення','Всі слова опрацьовано')+completion(`Ти пригадала всі ${r.total} слів за ${r.round} ${r.round===1?'коло':'кіл(а)'}.`);return}}let w=WORDS[r.queue[0]];$('#workspace').innerHTML=heading('Швидке повторення','Спробуй згадати значення, потім відкрий відповідь',`Коло ${r.round}`)+prog(r.done,r.total)+`<div class="prompt"><small>Англійське слово</small><strong>${esc(w.en)}</strong></div>${r.show?`<div class="prompt"><small>${state.deck==='uk'?'Переклад':'Пояснення'}</small><strong>${esc(meaning(w))}</strong></div><div class="review-actions"><button class="secondary" data-action="later">Повторити згодом</button><button class="primary" data-action="know">Пам’ятаю ✓</button></div>`:`<div class="controls"><button class="primary" data-action="show">Показати відповідь</button></div>`}<p class="status">Залишилося у колі: ${r.queue.length} · відкладено: ${r.later.length}</p>`}
function render(){if(!state.deck){$('#workspace').innerHTML=heading('Почни з набору','Обери тип карток вище, щоб відкрити слова й вправи.');return}let f={cards:renderCards,match:renderMatch,quiz:renderQuiz,type:renderType,build:renderBuild,review:renderReview};f[state.mode]()}
function advance(){state.index++;state.answered=false;state.chosen=undefined;state.options=null;state.status='';render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.deck){state.deck=b.dataset.deck;reset();return}if(b.dataset.mode){state.mode=b.dataset.mode;reset();return}
let a=b.dataset.action;if(!a)return;
if(a==='direction'){state.dir=b.dataset.dir;reset();return}if(a==='restart'){reset();return}
if(a==='flip'){state.flipped=!state.flipped;b.classList.toggle('flipped',state.flipped);b.setAttribute('aria-pressed',String(state.flipped));return}if(a==='next'){state.index++;state.flipped=false;render();return}if(a==='prev'){state.index--;state.flipped=false;render();return}if(a==='shuffle'){state.sequence=shuffle(WORDS.map((_,i)=>i));state.index=0;state.flipped=false;render();return}
if(a==='new-round'){makeMatch();render();return}
if(a==='match-left'){state.match.selected=Number(b.dataset.id);state.match.status='';render();return}
if(a==='match-right'){let m=state.match;if(m.selected===null){m.status='Спочатку обери слово ліворуч.'}else if(m.selected===Number(b.dataset.id)){m.done.push(m.selected);m.selected=null;m.status='Правильно!'}else{m.mistakes++;m.selected=null;m.status='Спробуй ще раз.'}render();return}
if(a==='answer'&&!state.answered){state.chosen=Number(b.dataset.choice);state.chosenCorrect=state.options[state.chosen]===target(WORDS[state.sequence[state.index]]);if(state.chosenCorrect)state.score++;state.answered=true;render();return}
if(a==='advance'){advance();return}
if(a==='letter'){let z=state.build;z.picked.push(Number(b.dataset.id));let word=WORDS[z.sequence[z.index]].en.toUpperCase(),typed=z.picked.map(i=>z.letters[i].ch).join('');if(typed.length===word.length){z.status=typed===word?'Правильно!':`Спробуй ще раз. Слово: ${word}`;if(typed===word)z.score++}render();return}
if(a==='undo'){state.build.picked.pop();render();return}if(a==='clear'){state.build.picked=[];render();return}if(a==='build-next'){state.build.index++;if(state.build.index<state.build.sequence.length)makeBuild();render();return}
if(a==='show'){state.review.show=true;render();return}if(a==='know'||a==='later'){let r=state.review,id=r.queue.shift();if(a==='know')r.done++;else r.later.push(id);r.show=false;render();return}
});
document.addEventListener('submit',e=>{if(e.target.id!=='type-form')return;e.preventDefault();if(state.answered)return;let typed=$('#typed').value,w=WORDS[state.sequence[state.index]];state.chosenCorrect=variants(target(w)).includes(norm(typed));if(state.chosenCorrect)state.score++;state.answered=true;render()});
renderShell();
</script>
